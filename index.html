<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Империя Кликов</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --card: #141a2b;
      --card-hover: #1c2438;
      --accent: #00f0ff;
      --accent2: #ff00aa;
      --gold: #ffd700;
      --text: #e8f0ff;
      --muted: #8b9bb4;
      --success: #00e676;
      --danger: #ff5252;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(ellipse at 20% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(255, 0, 170, 0.06) 0%, transparent 50%);
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px;
      padding-bottom: 100px;
    }

    header {
      text-align: center;
      padding: 16px 0 8px;
      position: relative;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .prestige-badge {
      position: absolute;
      top: 12px;
      right: 8px;
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      color: #1a1200;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0;
    }

    .stat-card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      border: 1px solid rgba(0, 240, 255, 0.1);
    }

    .stat-card .label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-card.gold .value {
      color: var(--gold);
    }

    /* Main click area */
    .click-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 24px 0;
    }

    .big-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 30% 30%, #1a3a5c, #0a1525);
      box-shadow: 
        0 0 0 6px rgba(0, 240, 255, 0.15),
        0 0 40px rgba(0, 240, 255, 0.25),
        inset 0 0 30px rgba(0, 240, 255, 0.1);
      color: var(--accent);
      font-size: 3.5rem;
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.15s;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    .big-btn:active {
      transform: scale(0.92);
      box-shadow: 
        0 0 0 4px rgba(0, 240, 255, 0.3),
        0 0 60px rgba(0, 240, 255, 0.4);
    }

    .big-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.2) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .big-btn:active::after {
      opacity: 1;
    }

    .click-power {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .click-power span {
      color: var(--accent);
      font-weight: 600;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      margin: 20px 0 12px;
      background: var(--card);
      border-radius: 12px;
      padding: 4px;
    }
