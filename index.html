<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CyberTap Game</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            overflow: hidden;
        }
        .header {
            text-align: center;
            margin-top: 10px;
            width: 100%;
        }
        .token-title {
            font-size: 14px;
            color: #00ffcc;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .score {
            font-size: 48px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
        }
        .coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            position: relative;
            width: 100%;
        }
        .coin {
            width: min(60vw, 220px);
            height: min(60vw, 220px);
            background: radial-gradient(circle, #001133 0%, #000a1f 100%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.5), inset 0 0 30px rgba(255, 0, 255, 0.2);
            cursor: pointer;
            transition: transform 0.05s ease;
            border: 4px solid #00ffcc;
            position: relative;
            overflow: hidden;
        }
        .coin:active {
            transform: scale(0.95);
            box-shadow: 0 0 60px rgba(0, 255, 204, 0.8), inset 0 0 40px rgba(255, 0, 255, 0.4);
        }
        .coin-text {
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #ff00ff;
        }
        .coin-sub {
            font-size: 11px;
            color: #a5f3fc;
            margin-top: 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .footer-panel {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }
        .energy-box {
            width: 100%;
        }
        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 6px;
            color: #94a3b8;
            font-weight: 700;
        }
        .energy-bar {
            width: 100%;
            height: 12px;
            background-color: #1e293b;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff00ff, #00ffcc);
            width: 100%;
            transition: width 0.2s ease;
        }
        .boost-btn {
            background: linear-gradient(135deg, #0044ff 0%, #00ffcc 100%);
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            transition: opacity 0.2s;
        }
        .boost-btn:active {
            opacity: 0.7;
        }
        .floating-text {
            position: absolute;
            color: #00ffcc;
            font-weight: 900;
            font-size: 24px;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.8);
            transition: transform 0.8s ease-out, opacity 0.8s ease-out;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="token-title">$CYBER Balance</div>
        <div class="score" id="score">0</div>
    </div>

    <div class="coin-container">
        <div class="coin" id="tapCoin">
            <div class="coin-text">TAP</div>
            <div class="coin-sub">MINING ACTIVE</div>
        </div>
    </div>

    <div class="footer-panel">
        <div class="energy-box">
            <div class="energy-info">
                <span>⚡ Energy</span>
                <span id="energyText">1000 / 1000</span>
            </div>
            <div class="energy-bar">
                <div class="energy-fill" id="energyFill"></div>
            </div>
        </div>
        <button class="boost-btn" id="watchAdBtn">Restore Energy</button>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            try { tg.ready(); tg.expand(); } catch (e) {}
        }

        let score = 0;
        let maxEnergy = 1000;
        let energy = 1000;
        let tapPower = 1;
        let pendingClicks = 0; 

        const scoreElement = document.getElementById('score');
        const tapCoin = document.getElementById('tapCoin');
        const energyFill = document.getElementById('energyFill');
        const energyText = document.getElementById('energyText');
        const watchAdBtn = document.getElementById('watchAdBtn');

        // Відновлення енергії (3 одиниці на секунду)
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 3);
                updateEnergyUI();
            }
        }, 1000);

        function updateEnergyUI() {
            energyText.innerText = `${energy} / ${maxEnergy}`;
            energyFill.style.width = `${(energy / maxEnergy) * 100}%`;
        }

        // Логіка тапання
        tapCoin.addEventListener('click', (e) => {
            if (energy >= tapPower) {
                energy -= tapPower;
                score += tapPower;
                pendingClicks += tapPower;
                
                scoreElement.innerText = score.toLocaleString();
                updateEnergyUI();

                // Візуальний ефект "+1"
                createFloatingText(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2, `+${tapPower}`);

                if (tg && tg.HapticFeedback) {
                    try { tg.HapticFeedback.impactOccurred('light'); } catch (err) {}
                }
            } else {
                if (tg && tg.HapticFeedback) {
                    try { tg.HapticFeedback.notificationOccurred('error'); } catch (err) {}
                }
            }
        });

        // Анімація літаючих цифр
        function createFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = `${x - 12}px`;
            el.style.top = `${y - 20}px`;
            document.body.appendChild(el);

            requestAnimationFrame(() => {
                el.style.transform = 'translateY(-70px)';
                el.style.opacity = '0';
            });

            setTimeout(() => { el.remove(); }, 800);
        }

        // Кнопка відновлення енергії
        watchAdBtn.addEventListener('click', () => {
            energy = maxEnergy;
            updateEnergyUI();
            if (tg && tg.HapticFeedback) {
                try { tg.HapticFeedback.notificationOccurred('success'); } catch (err) {}
            }
        });

        // Автоматична синхронізація із сервером Vercel кожні 5 секунд
        setInterval(async () => {
            if (pendingClicks > 0) {
                const clicksToSend = pendingClicks;
                pendingClicks = 0;
                try {
                    await fetch('/api/sync', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            clicks: clicksToSend,
                            user: tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : { id: 'demo_user' }
                        })
                    });
                } catch (err) {
                    pendingClicks += clicksToSend; // Повертаємо кліки у разі збою мережі
                }
            }
        }, 5000);
    </script>
</body>
</html>
