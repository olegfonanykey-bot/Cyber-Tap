<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .title { font-size: 14px; color: #00ffcc; letter-spacing: 2px; margin-bottom: 5px; text-transform: uppercase; }
        .score { font-size: 52px; font-weight: 900; margin-bottom: 40px; text-shadow: 0 0 20px rgba(0, 255, 204, 0.5); }
        .coin {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #00ffcc 0%, #0044ff 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 900;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.4);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.08s ease;
        }
        .coin:active { transform: scale(0.93); }
        .status { margin-top: 30px; font-size: 13px; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="title">Баланс $CYBER</div>
    <div class="score" id="score">0</div>

    <div class="coin" id="tapBtn">TAP</div>

    <div class="status" id="status">Підключено до сервера ✓</div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            try { tg.ready(); tg.expand(); } catch (e) {}
        }

        let score = 0;
        let pendingClicks = 0;

        const scoreEl = document.getElementById('score');
        const tapBtn = document.getElementById('tapBtn');
        const statusEl = document.getElementById('status');

        tapBtn.addEventListener('click', () => {
            score += 1;
            pendingClicks += 1;
            scoreEl.innerText = score.toLocaleString();

            if (tg && tg.HapticFeedback) {
                try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
            }
        });

        // Відправка кліків на сервер кожні 5 секунд
        setInterval(async () => {
            if (pendingClicks > 0) {
                const count = pendingClicks;
                pendingClicks = 0;
                try {
                    await fetch('/api/sync', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            clicks: count,
                            user: tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : { id: 'web_user' }
                        })
                    });
                    statusEl.innerText = 'Дані синхронізовано з сервером ✓';
                } catch (err) {
                    pendingClicks += count;
                    statusEl.innerText = 'Офлайн режим (збережено локально)';
                }
            }
        }, 5000);
    </script>
</body>
</html>
